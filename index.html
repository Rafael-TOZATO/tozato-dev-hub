<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tozato Dev Hub | App & Hub</title>
    
    <meta property="og:title" content="Tozato Dev Hub | App & Hub">
    <meta property="og:description" content="Aplicativo interativo e hub profissional criado por Rafael Ornelas Tozato.">
    <meta property="og:image" content="https://rafael-tozato.github.io/tozato-dev-hub/banner.jpg">
    <meta property="og:url" content="https://rafael-tozato.github.io/tozato-dev-hub/">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tozato Dev Hub | App & Hub">
    <meta name="twitter:description" content="Aplicativo interativo e hub profissional criado por Rafael Ornelas Tozato.">
    <meta name="twitter:image" content="https://rafael-tozato.github.io/tozato-dev-hub/banner.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .chat-container { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-6">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col my-auto">
        
        <div class="p-5 border-b border-slate-800 bg-slate-900/90 flex flex-col items-center text-center relative">
            <div class="absolute top-4 left-4">
                <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
            </div>
            
            <div class="w-full rounded-2xl overflow-hidden border border-slate-800 shadow-xl bg-slate-900 mb-4">
                <img src="banner.jpg" alt="Tozato Dev Hub Banner" class="w-full h-auto object-cover block">
            </div>

            <h1 class="font-bold text-xl leading-tight">Tozato Dev Hub</h1>
            <p class="text-xs text-slate-400 mt-0.5">Rafael Ornelas Tozato | App & Hub</p>
            
            <div class="flex items-center justify-center gap-3 mt-4 text-sm">
                <a href="https://github.com/Rafael-TOZATO" target="_blank" rel="noopener" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-cyan-600 hover:text-slate-950 text-slate-300 flex items-center justify-center transition shadow-md" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://www.linkedin.com/in/rafaeltozato81" target="_blank" rel="noopener" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-cyan-600 hover:text-slate-950 text-slate-300 flex items-center justify-center transition shadow-md" title="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://medium.com/@rafael-ornelas-tozato" target="_blank" rel="noopener" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-cyan-600 hover:text-slate-950 text-slate-300 flex items-center justify-center transition shadow-md" title="Medium">
                    <i class="fab fa-medium"></i>
                </a>
                <a href="https://www.dio.me/users/rafael_tozato" target="_blank" rel="noopener" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-cyan-600 hover:text-slate-950 text-slate-300 flex items-center justify-center transition shadow-md" title="DIO">
                    <i class="fas fa-graduation-cap"></i>
                </a>
            </div>
        </div>

        <div id="chat-messages" class="chat-container h-[360px] p-4 overflow-y-auto space-y-3 text-sm bg-slate-950/50">
            <div class="flex items-start space-x-2.5">
                <div class="w-7 h-7 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center flex-shrink-0 font-bold text-xs">AI</div>
                <div class="bg-slate-800/90 border border-slate-700/50 rounded-2xl p-3.5 max-w-[85%] text-slate-200 text-xs leading-relaxed">
                    Olá, Rafael! Digite <code class="text-cyan-300 bg-slate-950 px-1 py-0.5 rounded">repos</code> para ver seus projetos ou envie uma mensagem para conversar com a IA.
                </div>
            </div>
        </div>

        <form id="chat-form" class="p-3 border-t border-slate-800 bg-slate-900 flex gap-2">
            <input type="text" id="user-input" placeholder="Digite uma mensagem ou comando..." 
                class="flex-grow bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 transition">
            <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-semibold px-4 py-2.5 rounded-xl transition flex items-center justify-center shadow-md shadow-cyan-600/20">
                <i class="fas fa-paper-plane text-xs"></i>
            </button>
        </form>
    </div>

    <footer class="text-center text-[11px] text-slate-500 mt-2">
        &copy; 2026 Rafael Ornelas Tozato. Todos os direitos reservados.
    </footer>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        
        function getApiKey() {
            let key = localStorage.getItem('gemini_api_key');
            if (!key) {
                key = prompt("Insira sua chave da API do Gemini para ativar o chat:");
                if (key) {
                    localStorage.setItem('gemini_api_key', key.trim());
                }
            }
            return key || "";
        }

        function addMessage(text, sender) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-2.5 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            const avatar = document.createElement('div');
            avatar.className = `w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 font-bold text-xs ${isUser ? 'bg-blue-600 text-white' : 'bg-cyan-500/20 text-cyan-400'}`;
            avatar.textContent = isUser ? 'EU' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl p-3.5 max-w-[85%] text-slate-200 text-xs leading-relaxed ${isUser ? 'bg-blue-600/20 border border-blue-500/30' : 'bg-slate-800/90 border border-slate-700/50'}`;
            
            if (isUser) {
                bubble.textContent = text;
            } else {
                bubble.innerHTML = text;
            }

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatMessages.appendChild(wrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleUserMessage(message) {
            const query = message.toLowerCase().trim();
            
            if (query.includes('repos') || query.includes('projetos') || query.includes('github')) {
                addMessage("Buscando seus repositórios públicos no GitHub...", "bot");
                
                try {
                    const response = await fetch('https://api.github.com/users/Rafael-TOZATO/repos?sort=updated&per_page=4');
                    const repos = await response.json();
                    
                    if (Array.isArray(repos) && repos.length > 0) {
                        let html = "Repositórios recentes:<br><ul class='mt-2 space-y-1.5'>";
                        repos.forEach(repo => {
                            const desc = repo.description ? repo.description : 'Sem descrição.';
                            html += `<li class='bg-slate-950/60 p-2 rounded border border-slate-800/60'>
                                <a href="${repo.html_url}" target="_blank" rel="noopener" class="text-cyan-400 font-semibold hover:underline flex items-center gap-1">
                                    <i class="fas fa-book-bookmark text-[10px]"></i> ${repo.name}
                                </a>
                                <p class='text-[10px] text-slate-400 mt-0.5 truncate'>${desc}</p>
                            </li>`;
                        });
                        html += "</ul>";
                        addMessage(html, "bot");
                    } else {
                        addMessage("Não encontrei repositórios públicos no momento.", "bot");
                    }
                } catch (error) {
                    addMessage("Ocorreu um erro ao conectar com a API do GitHub.", "bot");
                }
            } else {
                const apiKey = getApiKey();
                if (!apiKey) {
                    addMessage("Chave de API não informada. O chat precisa de uma chave válida para responder.", "bot");
                    return;
                }

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: message }] }]
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.candidates && data.candidates.length > 0 && data.candidates[0].content) {
                        const aiReply = data.candidates[0].content.parts[0].text;
                        addMessage(aiReply, 'bot');
                    } else if (data.error) {
                        addMessage(`Erro da API do Gemini: ${data.error.message}`, 'bot');
                    } else {
                        addMessage("Recebi uma resposta vazia da IA.", 'bot');
                    }
                } catch (error) {
                    addMessage("Desculpe, ocorreu um erro de conexão com o Gemini.", 'bot');
                }
            }
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;
            
            addMessage(text, 'user');
            userInput.value = '';
            
            handleUserMessage(text);
        });
    </script>
</body>
</html>
