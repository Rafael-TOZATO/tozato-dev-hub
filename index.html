<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TozatoCode-AI | Hub Profissional & Assistente</title>
    
    <meta property="og:title" content="TozatoCode-AI | Hub Profissional & Assistente">
    <meta property="og:description" content="Assistente técnico inteligente e hub de desenvolvimento profissional.">
    <meta property="og:image" content="https://rafaeltozato.github.io/site-tozatocode-ai/assets/preview.png">
    <meta property="og:url" content="https://rafaeltozato.github.io/site-tozatocode-ai/">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .chat-container { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-bold">
                    TC
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight">TozatoCode-AI</h1>
                    <p class="text-xs text-slate-400">Hub Profissional & Assistente</p>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 flex flex-col">
        <div id="chatMessages" class="chat-container flex-1 overflow-y-auto space-y-4 pr-2 mb-4 min-h-[400px] max-h-[60vh]">
            <div class="flex items-start space-x-3">
                <div class="w-8 h-8 rounded-lg bg-cyan-600 flex items-center justify-center text-xs font-bold text-white">IA</div>
                <div class="rounded-2xl p-4 max-w-[80%] bg-slate-900 border border-slate-800 text-slate-200 text-sm">
                    Olá! Sou o assistente integrado ao TozatoCode-AI. Como posso ajudar em seus projetos hoje?
                </div>
            </div>
        </div>

        <form id="chatForm" class="mt-auto flex gap-3 bg-slate-900 p-3 rounded-2xl border border-slate-800">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Digite sua mensagem ou comando..." 
                class="flex-1 bg-transparent border-none outline-none px-3 text-slate-100 placeholder-slate-500 text-sm"
                autocomplete="off"
                required
            >
            <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition-colors flex items-center justify-center">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </main>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');

        function addMessage(text, sender) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold text-white ${isUser ? 'bg-slate-700' : 'bg-cyan-600'}`;
            avatar.textContent = isUser ? 'EU' : 'IA';

            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl p-4 max-w-[80%] text-sm ${isUser ? 'bg-cyan-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'}`;
            
            if (isUser) {
                bubble.textContent = text;
            } else {
                bubble.innerHTML = text;
            }

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatMessages.appendChild(wrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleUserMessage(message) {
            const query = message.toLowerCase().trim();

            if (query.includes('repos') || query.includes('repositorios')) {
                addMessage("Buscando seus repositórios públicos...", "bot");
                try {
                    const response = await fetch('https://api.github.com/users/rafaeltozato/repos');
                    const repos = await response.json();
                    
                    if (Array.isArray(repos)) {
                        let html = "<p class='mb-2'>Aqui estão os seus repositórios recentes:</p><ul class='space-y-2'>";
                        repos.slice(0, 5).forEach(repo => {
                            html += `<li class='bg-slate-800/50 p-2.5 rounded-xl border border-slate-700/50'>
                                <a href="${repo.html_url}" target="_blank" class="text-cyan-400 font-medium hover:underline flex items-center justify-between">
                                    ${repo.name} <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                                </a>
                                <p class="text-xs text-slate-400 mt-1">${repo.description || 'Sem descrição.'}</p>
                            </li>`;
                        });
                        html += "</ul>";
                        addMessage(html, "bot");
                    } else {
                        addMessage("Não foi possível carregar os repositórios no momento.", "bot");
                    }
                } catch (error) {
                    addMessage("Erro ao conectar com a API do GitHub.", "bot");
                }
                return;
            }

            const apiKey = "AQ.Ab8RN6IR8vVzMrUjwg6iJdOnSPTRvAfrOKfDUCblk34KuUyXgQ";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: message }] }]
                    })
                });
                const data = await response.json();
                
                if (data.candidates && data.candidates.length > 0 && data.candidates[0].content) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    addMessage(aiReply, 'bot');
                } else if (data.error) {
                    addMessage(`Erro da API: ${data.error.message}`, 'bot');
                } else {
                    addMessage("Recebi uma resposta vazia ou inválida da IA.", 'bot');
                }
            } catch (error) {
                addMessage("Desculpe, ocorreu um erro de conexão com o Gemini.", 'bot');
            }
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            handleUserMessage(text);
        });
    </script>
</body>
</html>
